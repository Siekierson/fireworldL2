services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
    depends_on:
      - backend
    networks:
      - fireworld-network

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    environment:
      - PORT=3001
      - DB_HOST=database
      - REDIS_HOST=redis
    volumes:
      - ./.env.local:/app/.env.local:ro
    depends_on:
      - database
      - redis
    networks:
      - fireworld-network

  database:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=fireworld
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fireworld-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - fireworld-network

networks:
  fireworld-network:
    driver: bridge

volumes:
  postgres-data:

